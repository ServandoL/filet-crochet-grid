server {
    listen 80;
    server_name _;

    # Serve the Angular build
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Cache hashed static assets aggressively
    location ~* \.[0-9a-f]\{8,\}\.(js|css|woff2?|ttf|eot|svg|png|webp|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Reverse proxy all /api requests to the backend
    location /api {
        proxy_pass         http://backend:9000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Angular SPA fallback: let the router handle all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}

