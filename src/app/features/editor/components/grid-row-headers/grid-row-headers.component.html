<div
  class="relative origin-top-left flex flex-col shrink-0 touch-pan-x touch-pan-y"
  [style.width.px]="HEADER_WIDTH * zoomLevel()"
  [style.height.px]="rows() * cellSize() * zoomLevel()"
>
  <div
    class="absolute top-0 left-0 origin-top-left flex flex-col shrink-0"
    [style.width.px]="HEADER_WIDTH"
    [style.height.px]="rows() * cellSize()"
    [style.transform]="'scale(' + zoomLevel() + ')'"
  >
    @for (row of rowIndices(); track row) {
      <button
        type="button"
        class="flex items-center justify-center text-xs font-mono text-gray-500 border-b
               border-gray-200 bg-gray-50 hover:bg-indigo-50 hover:text-indigo-700 shrink-0
               focus:outline-none focus:ring-2 focus:ring-inset focus:ring-indigo-500
               disabled:cursor-default disabled:hover:bg-gray-50 disabled:hover:text-gray-500
               transition-colors select-none"
        [style.height.px]="cellSize()"
        [disabled]="readonly()"
        [attr.aria-disabled]="readonly() || null"
        [attr.aria-label]="progressMode() ? ('Row ' + (row + 1) + ': tap to mark complete') : ('Row ' + (row + 1) + ': click to fill or clear')"
        (click)="onRowClick(row)"
      >
        {{ row + 1 }}
      </button>
    }
  </div>
</div>
