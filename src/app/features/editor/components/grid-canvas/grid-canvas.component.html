<!--
  touch-action: pan-x pan-y — allows the browser to handle scrolling (panning)
  while we intercept pinch-zoom gestures in JS (which is not included here).

  Scroll-sync note: row/column header strips use CSS `position: sticky` inside a shared
  overflow-auto scroll container. This means the browser natively keeps the headers
  anchored without any JS scroll-event wiring — making JS scroll-sync (tasks 11.4/12.4)
  unnecessary. This is a deliberate architectural decision (see design.md Decision #1).
-->
<div
  class="relative origin-top-left touch-pan-x touch-pan-y"
  [style.width.px]="cols() * cellSize() * zoomLevel()"
  [style.height.px]="rows() * cellSize() * zoomLevel()"
>
  <div
    class="absolute top-0 left-0 origin-top-left"
    [style.width.px]="cols() * cellSize()"
    [style.height.px]="rows() * cellSize()"
    [style.transform]="'scale(' + zoomLevel() + ')'"
  >
    <canvas
      #canvas
    [attr.aria-label]="'Filet crochet grid, ' + rows() + ' rows by ' + cols() + ' columns'"
    role="img"
    class="block"
    (click)="onCanvasClick($event)"
    ></canvas>
  </div>
</div>
