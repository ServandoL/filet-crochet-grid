<div
  class="relative origin-top-left flex shrink-0 touch-pan-x touch-pan-y"
  [style.height.px]="HEADER_HEIGHT * zoomLevel()"
  [style.width.px]="(ROW_HEADER_WIDTH + cols() * cellSize()) * zoomLevel()"
>
  <div
    class="absolute top-0 left-0 origin-top-left flex shrink-0"
    [style.height.px]="HEADER_HEIGHT"
    [style.width.px]="ROW_HEADER_WIDTH + cols() * cellSize()"
    [style.transform]="'scale(' + zoomLevel() + ')'"
  >
    <!-- Left spacer aligns with row-header strip -->
    <div [style.width.px]="ROW_HEADER_WIDTH" class="shrink-0"></div>

    @for (col of colIndices(); track col) {
      <button
        type="button"
        class="flex items-center justify-center text-xs font-mono text-gray-500 border-r
               border-gray-200 bg-gray-50 hover:bg-indigo-50 hover:text-indigo-700 shrink-0
               focus:outline-none focus:ring-2 focus:ring-inset focus:ring-indigo-500
               disabled:cursor-default disabled:hover:bg-gray-50 disabled:hover:text-gray-500
               transition-colors select-none"
        [style.width.px]="cellSize()"
        [disabled]="readonly()"
        [attr.aria-disabled]="readonly() || null"
        [attr.aria-label]="progressMode() ? ('Column ' + (col + 1) + ': tap to mark complete') : ('Column ' + (col + 1) + ': click to fill or clear')"
        (click)="onColClick(col)"
      >
        {{ col + 1 }}
      </button>
    }
  </div>
</div>
