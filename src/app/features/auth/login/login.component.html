<div class="px-4 py-6">
  <div class="app-card w-full max-w-sm mx-auto rounded-2xl shadow-sm p-6 sm:p-8">
    <h1 class="text-2xl font-semibold app-text mb-6 text-center">
      Filet Crochet
    </h1>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="space-y-5">

      <!-- Email -->
      <div class="flex flex-col gap-1">
        <label for="email" class="text-sm font-medium app-text-muted">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          class="app-input rounded-lg border px-3 py-2 min-h-[44px] text-sm"
          [class.app-input-invalid]="emailInvalid()"
          aria-describedby="email-error"
        />
        @if (emailInvalid()) {
          <p id="email-error" class="text-xs app-text-danger" role="alert">
            @if (email.hasError('required')) {
              Email is required.
            } @else if (email.hasError('email')) {
              Enter a valid email address.
            }
          </p>
        }
      </div>

      <!-- Password -->
      <div class="flex flex-col gap-1">
        <label for="password" class="text-sm font-medium app-text-muted">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          class="app-input rounded-lg border px-3 py-2 min-h-[44px] text-sm"
          [class.app-input-invalid]="passwordInvalid()"
          aria-describedby="password-error"
        />
        @if (passwordInvalid()) {
          <p id="password-error" class="text-xs app-text-danger" role="alert">
            Password is required.
          </p>
        }
      </div>

      <!-- API error -->
      @if (apiError()) {
        <p class="text-sm app-text-danger text-center" role="alert">{{ apiError() }}</p>
      }

      <button
        type="submit"
        class="app-button-primary focus-ring w-full rounded-lg py-2 min-h-[44px] text-sm font-semibold
               disabled:opacity-50"
        [disabled]="loading()"
      >
        {{ loading() ? 'Signing in…' : 'Log In' }}
      </button>

    </form>
  </div>
</div>
