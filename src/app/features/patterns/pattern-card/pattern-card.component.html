<article
  class="app-card rounded-2xl shadow-sm p-5 flex flex-col gap-4 hover:shadow-md transition-shadow"
>
  <div>
    <h2 class="text-base font-semibold app-text truncate">{{ pattern().name }}</h2>
    <p class="text-sm app-text-muted mt-0.5">
      {{ pattern().rows }} × {{ pattern().cols }}
      &nbsp;·&nbsp;
      {{ lastEdited() }}
    </p>
  </div>

  <div class="flex gap-2 mt-auto">
    <button
      type="button"
      (click)="onEdit()"
      class="app-button-accent-soft focus-ring flex-1 rounded-lg text-sm font-medium py-1.5 min-h-[36px]"
    >
      Edit
    </button>
    <button
      type="button"
      (click)="onView()"
      class="app-button-secondary focus-ring flex-1 rounded-lg text-sm font-medium py-1.5 min-h-[36px]"
    >
      View
    </button>
    <button
      type="button"
      (click)="onProgress()"
      class="app-button-secondary focus-ring flex-1 rounded-lg text-sm font-medium py-1.5 min-h-[36px]"
      [attr.aria-label]="'Track progress for ' + pattern().name"
    >
      Progress
    </button>
    <button
      #deleteBtn
      type="button"
      (click)="openDeleteDialog()"
      class="app-button-danger-soft focus-ring rounded-lg text-sm font-medium px-3 py-1.5 min-h-[36px]"
      aria-label="Delete pattern"
    >
      Delete
    </button>
  </div>

  @if (deleteError()) {
    <p class="text-xs app-text-danger" role="alert">{{ deleteError() }}</p>
  }
</article>

<!-- Confirm delete dialog -->
@if (confirmingDelete()) {
  <div
    cdkTrapFocus
    cdkTrapFocusAutoCapture
    class="fixed inset-0 z-50 flex items-center justify-center bg-[var(--theme-overlay)]"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="'dialog-title-' + pattern()._id"
  >
    <div class="app-card rounded-2xl shadow-xl p-6 w-full max-w-sm mx-4">
      <h3
        [id]="'dialog-title-' + pattern()._id"
        class="text-base font-semibold app-text mb-2"
      >
        Delete "{{ pattern().name }}"?
      </h3>
      <p class="text-sm app-text-muted mb-6">This cannot be undone.</p>
      <div class="flex gap-3 justify-end">
        <button
          cdkFocusInitial
          type="button"
          (click)="cancelDelete()"
          class="app-button-secondary focus-ring rounded-lg px-4 py-2 min-h-[44px] text-sm font-medium"
        >
          Cancel
        </button>
        <button
          type="button"
          (click)="onDeleteConfirmed()"
          [disabled]="deleting()"
          class="app-button-danger focus-ring rounded-lg px-4 py-2 min-h-[44px] text-sm font-medium
                 disabled:opacity-50"
        >
          {{ deleting() ? 'Deleting…' : 'Delete' }}
        </button>
      </div>
    </div>
  </div>
}
