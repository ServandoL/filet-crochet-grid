services:
  # ── nginx: serves the Angular SPA and proxies /api to the backend ───────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Expose on all local-network interfaces on port 80 and 443
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ── SB backend ──────────────────────────────────────────────────────────────
  backend:
    # Build from the Spring Boot repository root (adjust path if the Spring project is in a sub-folder)
    build:
      context: /Users/servandoluviano/IdeaProjects/filet-crochet                # path to the Spring project (repo root)
      dockerfile: Dockerfile    # the Dockerfile we added at repo root
    expose:
      - "9000"                  # allow other services on the same docker network to reach port 9000
    environment:
      # Tell the Spring Boot container to bind to port 9000 (so nginx can keep using 9000)
      - SERVER_PORT=9000

      # Mongo configuration - map the env names to what the Spring app expects
      - MONGO_URI=${MONGO_URI}                       # e.g. mongodb://user:pass@mongo:27017/production
      - MONGO_DB=${MONGO_DB_NAME:-filet-crochet-grid}

      # Optional: JWT secret (kept for compatibility) and JVM opts
      - JWT_SECRET=${JWT_SECRET}
      - JAVA_OPTS=${JAVA_OPTS:-}

      # Optional: override CORS allowed origins if needed (app reads app.cors.allowed-origins from CORS_ORIGINS)
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:4200,http://localhost:5173}

    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:9000/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy


